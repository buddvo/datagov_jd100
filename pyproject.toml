[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "buddvo-datagov_jd100"
version = "0.1.0"
description = "按结构键把条目聚类，标出数据治理与血缘专家·缓存命中率的归因上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "buddvo" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://buddvo.github.io"
Repository = "https://github.com/buddvo/datagov_jd100"
Issues = "https://github.com/buddvo/datagov_jd100/issues"

[project.scripts]
datagov_jd100 = "datagov_jd100:main"

[tool.setuptools]
py-modules = ["datagov_jd100"]
